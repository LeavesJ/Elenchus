name: gate

# The gate itself lives in the private Felix repo, not here. This file is only
# the wiring that lets GitHub run it, which is why it is the single addition to
# this repo's tracked set. Everything it enforces is defined elsewhere.

on:
  pull_request:
  push:
    branches: [main]

# CI reads code and reports a status. It never writes to the repo.
permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Two sibling checkouts rather than nesting Felix inside the tree being
      # gated. A harness sitting in the working tree would show up in the very
      # checks it is running: ruff would descend into it and git status would
      # report it.
      - name: Check out Elenchus
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out Felix
        uses: actions/checkout@v4
        with:
          repository: LeavesJ/felix
          ssh-key: ${{ secrets.FELIX_DEPLOY_KEY }}
          path: felix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Pinned to the versions the gate was authored against. pyproject allows
      # ruff>=0.6, and its own comment records that a ruff bump once turned a
      # green tree red across ~40 untouched sites. A gate whose verdict depends
      # on which ruff CI happened to resolve that morning is not a gate.
      - name: Install dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]" "ruff==0.16.0" "pytest==9.1.1"

      # Fails the job if Felix cannot tell which project this is, so a broken
      # binding surfaces here rather than silently gating nothing.
      - name: Confirm the governing project
        working-directory: repo
        run: ../felix/engine/harness/felix which

      # No ANTHROPIC_API_KEY is provided on purpose. The @live tests skip
      # without one, so CI stays free and never bills a pull request.
      - name: Run the gate
        working-directory: repo
        run: ../felix/engine/harness/felix gate

  # The guidebook's Phase 1 loop asks for "deploy preview" and then "test it",
  # and this repository had neither. scripts/smoke_server.py already raised the
  # real app against the scripted fake model, but no gate and no workflow ever
  # referenced it — while two static suites opened by saying "the browser smoke
  # supplies the behavioural teeth". The teeth were a manual habit.
  #
  # A separate job on purpose. The gate answers "is this code correct" before
  # anything is stood up; this answers "does the thing actually come up and
  # serve" after it is, which is a different question and must be able to fail
  # on its own. It is not a deploy to anywhere a stranger can reach — it is the
  # smallest honest version of a preview: the real app, on a real port, over
  # real HTTP, checked by something that fails.
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Elenchus
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]" "pytest==9.1.1"

      # No ANTHROPIC_API_KEY here either. The smoke server is wired to the
      # deterministic scripted model, so the preview costs nothing and cannot
      # vary between runs.
      - name: Stand up the preview
        run: |
          python scripts/smoke_server.py --port 8123 --fresh --db "$RUNNER_TEMP/preview.db" \
            > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo "PREVIEW_URL=http://127.0.0.1:8123" >> "$GITHUB_ENV"

      # Bounded wait, and a failure here is a real failure: an app that never
      # binds is the thing this job exists to catch. The log is printed so the
      # reason is in the run rather than in somebody's memory.
      - name: Wait for it to answer
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8123/; then
              echo "preview answered after ${i}s at http://127.0.0.1:8123"
              exit 0
            fi
            sleep 1
          done
          echo "preview never answered on :8123 after 60s" >&2
          cat "$RUNNER_TEMP/preview.log" >&2
          exit 1

      - name: Test it
        run: python -m pytest tests/test_preview.py -m preview -q

      - name: Preview log
        if: always()
        run: cat "$RUNNER_TEMP/preview.log" || true

  # Strix: autonomous pentesting agents, Apache-2.0, from usestrix. The Phase 1
  # build list names it and a prior audit concluded it did not exist — that
  # audit checked the plugin marketplace, PATH, pip and brew, and never searched
  # the web. It exists, and this is it.
  #
  # Advisory on purpose, for now. It is an LLM agent: 15-30 minutes per quick
  # run, real token spend, and non-deterministic — which is the opposite of what
  # a required check should be. It earns `continue-on-error: false` once its
  # false-positive rate here is known, and not before.
  #
  # Installed from PyPI at a pinned version rather than the documented
  # `curl … | bash`, so CI is not executing an unpinned remote script on every
  # build.
  pentest:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out Elenchus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skips cleanly until the founder adds the secrets, so this job never
      # fails for a reason nobody can act on from inside a pull request.
      - name: Is Strix configured?
        id: cfg
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "LLM_API_KEY is not set; skipping. felix setup names this step." >&2
          fi

      - name: Set up Python
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Strix
        if: steps.cfg.outputs.ready == 'true'
        run: pip install "strix-agent==1.5.3"

      # Scoped to what the pull request changed. A full-tree run is 60-120
      # minutes and belongs on a schedule, not on every push.
      - name: Scan what this branch changes
        if: steps.cfg.outputs.ready == 'true'
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ --scan-mode quick \
            --scope-mode diff --diff-base "origin/${{ github.base_ref }}"

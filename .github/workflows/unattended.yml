name: unattended repair

# Wired, and off.
#
# Every guard below runs whether or not the switch is on, so the path is
# exercised rather than theoretical. Nothing invokes a model until the repository
# variable FELIX_UNATTENDED is set to "true", which is a deliberate act by a
# person who has watched the risk rules judge some real changes first.
#
# The rules deciding what is in scope were written in one sitting and have never
# been tested against a real failure. Turning this on before they have is
# trusting a boundary nobody has walked into.
#
#   gh variable set FELIX_UNATTENDED --body true --repo OWNER/REPO     enable
#   gh variable delete FELIX_UNATTENDED --repo OWNER/REPO              disable
#
# The division of labour matters more than any single guard. The model may read
# and edit, and nothing else. It cannot run git, cannot push, and cannot decide
# that its own work is finished. The workflow runs the gate afterwards and pushes
# only if the gate is green. An agent that verifies itself is not verified.
#
# That holds for what the model touches as well as for whether it worked. The
# prompt tells it to edit only the files the brief names, and a prompt is the
# model verifying itself. So before the gate, the verify step refuses a change
# to any other file, and classifies the model's own commit against the risk
# rules, content rules included. A red result there, or a file outside the
# brief, is not pushed and goes to a person, however green the gate would be.
#
# And the model is left nothing to copy. actions/checkout keeps what it fetched
# with unless told otherwise: the job's token in repo/.git/config as an
# http.extraheader, and the deploy key as a file under $RUNNER_TEMP that
# felix/.git/config names by path. A tool-name allow rule matches every path,
# so `--allowedTools "Read,Edit"` opens all three, and the push step below
# commits every tracked change. Measured on the pinned 2.1.37 (2026-09-23, the
# real binary against a scripted Messages API): Read returned all three, Edit
# put their contents in a tracked file, and the gate's secret scan passed the
# diff, since a base64 header and a ghs_ token are shapes it does not know. A
# model steered by a hostile failing log is the reader to plan for. So neither
# checkout persists what it fetched with, the token reaches git in the push
# step alone, from that step's environment, in no file and no argument, and
# the model's own tools are scoped to the checkout with its .git denied.
# tests/run holds the checks ("leaves the model no credential to copy").
#
# The push uses this workflow's GITHUB_TOKEN, and GitHub starts no workflow for
# an event that token causes, workflow_dispatch and repository_dispatch
# excepted. On github.com a pull request the token updates gets a pull_request
# run that waits for a person to approve it. So the regate job below dispatches
# the gate on the branch after a push, and that run is where a repaired commit
# gets its verdict and where felix repair's ceiling sees the repair's outcome.
# It does not make the loop go round by itself: a run dispatched with this
# token is reported not to fire workflow_run when it completes
# (github.com/orgs/community/discussions/48748), so a repair whose run is red
# waits for a person or the next push. Only a GitHub App or personal token
# would change that, and a new credential is a person's decision. The same
# token cannot push a change under .github/workflows, so a repair that edits one
# is refused before the gate is spent on it.
#
# The gate workflow has to accept workflow_dispatch. felix bootstrap writes it
# that way; a gate workflow written earlier needs `workflow_dispatch:` in its
# `on:`, or the regate job fails and says so.

on:
  workflow_run:
    workflows: [gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One at a time. A loop that can fan out is not bounded by an attempt ceiling,
# because each branch of the fan has its own.
concurrency:
  group: unattended-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    # workflow_run carries repository secrets even when the run it followed came
    # from a fork. The checkout below would fail for a fork branch anyway, but
    # relying on an accident is not a control, so same-repo is explicit.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      # v5, the lowest major that runs on Node 24. v4 targets Node 20, which
      # the runner forces onto Node 24 with a warning until it stops doing so.
      # Pinned to v5.1.0's full commit sha, here and at the Felix checkout;
      # the pin comment there says why and how it moves.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
          path: repo
          # The job's token stays out of repo/.git/config. The push step
          # supplies it itself, and nothing between here and there needs it:
          # felix repair and the escalation label go through gh with a
          # GH_TOKEN of their own, and the gate reads refs this fetch brought.
          persist-credentials: false

      # Pinned, to the full sha of the Felix commit this file was copied from,
      # quoted so it is a string: YAML reads a sha of all digits as a number.
      # Felix publishes no tags. The scope step below branches on felix repair's
      # exit status, a contract between this file and the engine that
      # lib/repair.sh lists. Without a ref the engine is whatever Felix's default
      # branch holds when the job runs, and that contract changed four times on
      # 2026-09-23 (2 took in a ceiling that could not be counted, 4 split off
      # from 2, nothing to repair moved from 0 to 5, then 0 narrowed to failed
      # or timed-out runs with a log) under copies that had not changed.
      # Pinned, the engine and this file move together, in one change reviewed
      # here: copy the template again from the commit the new pin names. The
      # claude-code install below is pinned for the same reason: this job holds
      # a write token, and an API key once it is switched on, and an unpinned
      # checkout runs whatever merged in Felix that day.
      #
      # actions/checkout is pinned for that reason too, at both checkouts. A tag
      # is a ref its owner can move, so @v5 runs whatever that repository points
      # v5 at on the day, in this step, which fetches with the deploy key.
      # Moving it is the same one-change review as moving the Felix pin: both
      # uses: lines to the new release's full commit sha (dereference an
      # annotated tag to its commit), with the release in the comment beside
      # them. tests/run holds every uses: in this file to a full sha.
      #
      # What the pin costs: the risk table and gate script Felix holds for this
      # repository are read from the same commit. A path made red in Felix after
      # the pin is not red to this loop until the pin moves, so move it when
      # either changes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: LeavesJ/felix-home
          ref: '6fe5f98688456fa95a7198e4c0eceadb9fe43741'
          ssh-key: ${{ secrets.FELIX_DEPLOY_KEY }}
          path: felix
          # With the fetch done, the checkout takes back the key file under
          # $RUNNER_TEMP and the core.sshCommand naming it before the next
          # step runs (its removeAuth). Nothing after this talks to Felix's
          # remote: the engine is read from disk.
          persist-credentials: false

      # Scope before anything reads the failing log. Handing a model the
      # diagnostics and then telling it what it may not touch is the wrong order.
      - name: Scope the failure
        id: scope
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # Actions runs a step that names no shell as `bash -e`, and under
          # pipefail that ended this step at felix repair's first non-zero
          # status, before rc was read: a ceiling or a red path failed the job
          # and escalated nothing, and nothing to repair would have failed it
          # too. Every exit below is explicit instead.
          set +e -uo pipefail
          # The files the failing log names, which are the only files the
          # verify step lets a repair change. felix repair empties the file and
          # fills it only with a brief; it is removed first so a Felix that
          # never wrote it cannot leave one behind that reads as a set.
          rm -f /tmp/implicated.txt
          ../felix/engine/harness/felix repair --implicated /tmp/implicated.txt | tee /tmp/brief.txt
          rc=${PIPESTATUS[0]}
          # Only 0 is a brief to act on: a gate run that failed or timed out,
          # with a log to read. 5 is nothing to repair: the gate has not run on
          # the branch, is still running, is green, or ended without failing.
          # 4 is a checkout the Felix checked out above does not govern, 3 a
          # red path, 2 a repair ceiling that is reached or could not be
          # counted, and anything else a gate run nobody could read: its runs
          # or its log unreadable, or a run that never started and left none.
          # lib/repair.sh lists the same statuses. Until 2026-09-23 nothing to repair exited
          # 0, so a dispatch on a green branch would have spent the budget and
          # handed a model a brief saying nothing was wrong. This also
          # proceeded on everything but 3, which under plain bash let a
          # reached ceiling do the same; under `bash -e` the step ended first.
          if [ "$rc" = "0" ]; then
            # A brief with no file in it leaves a repair nothing it may change,
            # so every edit would be refused after the budget was spent and a
            # model run. It stops here instead, without a label: the failure
            # is already red on the pull request, and nothing risky is known
            # about it, only that the log names no file in this checkout.
            if [ -s /tmp/implicated.txt ]; then
              # Handed on as a step output and not left in the file. With
              # `Read,Edit` unscoped the model read and edited /tmp and the
              # Felix checkout (measured on the pinned CLI, 2026-09-23), so a
              # set read back from disk after it ran would hold only while the
              # attempt step's scoping does. An output is fixed once this
              # step ends, whatever the model could reach.
              d="FELIX_IMPLICATED_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
              { echo "implicated<<$d"; cat /tmp/implicated.txt; echo "$d"
                echo "proceed=yes"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "proceed=no" >> "$GITHUB_OUTPUT"
            if [ ! -f /tmp/implicated.txt ]; then
              echo "felix repair wrote no implicated set, so no repair could be held to one; the Felix pinned here may predate --implicated. Copy the template again from the commit its pin names" >&2
              exit 1
            fi
            echo "unnamed=yes" >> "$GITHUB_OUTPUT"
            echo "the failing log names no file in this checkout, so an unattended repair has nothing it may change"
            exit 0
          fi

          echo "proceed=no" >> "$GITHUB_OUTPUT"
          case "$rc" in
            # Not a stop for a person: nothing failed, so nothing is escalated
            # and the job passes.
            5) echo "nothing=yes" >> "$GITHUB_OUTPUT"
               echo "nothing to repair on $BRANCH"; exit 0 ;;
            3) echo "out of scope: a red path is implicated" >&2 ;;
            2) echo "the repair ceiling is reached, or could not be counted" >&2 ;;
            # Wiring, not the change: it holds for every branch at once, so no
            # pull request is labelled for it and the job fails instead.
            4) echo "no project in the Felix this workflow checked out governs this repository, or its .felix names one that does not exist; fix the binding, since no pull request can" >&2
               exit 1 ;;
            *) echo "felix repair could not read the gate's runs or the failing run's log (exit $rc); nothing is repaired from a run nobody read" >&2
               exit 1 ;;
          esac
          # Escalation is the one path that must not fail quietly. If the label
          # cannot be applied, the job fails so somebody notices, rather than a
          # red-path failure disappearing into a green checkmark.
          pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$pr" ]; then
            echo "no open PR for $BRANCH; cannot escalate by label" >&2; exit 1
          fi
          gh pr edit "$pr" --add-label needs-founder || {
            echo "failed to apply needs-founder to #$pr" >&2; exit 1; }

      # Budget is spent only by a run that will actually do something. Charging
      # for a run that stops at the switch would exhaust the ceiling while the
      # loop was still disabled, and leave nothing for the day it is enabled.
      - name: Spend from the budget
        id: budget
        if: steps.scope.outputs.proceed == 'yes' && vars.FELIX_UNATTENDED == 'true'
        working-directory: repo
        run: |
          if ../felix/engine/harness/felix budget --record --why "ci repair"; then
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt a repair
        if: steps.budget.outputs.proceed == 'yes'
        working-directory: repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          # Pinned. An unpinned global install pulls whatever shipped that
          # morning into a job holding an API key.
          #
          # npm's output is shown only when the install fails. It was thrown
          # away, and Actions runs this step as `bash -e`, so a failed install
          # ended the step at that line with nothing printed, after the budget
          # step had already recorded the run's spend.
          if ! npm_log="$(npm install -g @anthropic-ai/claude-code@2.1.37 2>&1)"; then
            printf '%s\n' "$npm_log" | tail -20 >&2
            echo "could not install @anthropic-ai/claude-code@2.1.37, so no repair was attempted; this run's spend is already recorded against the daily budget" >&2
            exit 1
          fi
          # Read and Edit only, inside the checkout, and not its .git. No git,
          # no shell, no push. The model changes files; this workflow decides
          # whether the change is acceptable. The rules are path-scoped
          # because a bare tool name matches every path. Measured on 2.1.37:
          # `Read,Edit` read and edited ../felix/.git/config and a file under
          # $RUNNER_TEMP, and a deny on .git/** alone still left the Felix
          # checkout's config editable, where core.hooksPath would have made
          # the verify step's own git commands run code with the token in
          # their environment. Scoped to ./**, every path outside the working
          # directory is refused in -p, and .git/** is refused inside it. The
          # brief already names every file the model may touch.
          #
          # And not its own environment. This step's ANTHROPIC_API_KEY is the
          # claude process's too, and on Linux a process's environment is a
          # file, /proc/self/environ, which a tool-name allow rule opens like
          # any other path. Measured on the pinned 2.1.37 on ubuntu-latest
          # (2026-09-24, the real binary against a scripted Messages API):
          # Read returned it, key included, and Edit put the key in a tracked
          # file for the push step to commit. A model steered by a hostile
          # failing log is the reader to plan for. The deny rule below is
          # read before the allow rule, and in the same measurement refused
          # every spelling of the path (/proc/self/environ, /proc/self/../
          # self/environ, a relative path climbing to /proc, /proc//self/
          # environ, /proc/thread-self/environ) while the repository's own
          # files stayed readable. One slash, `Read(/proc/**)`, refused
          # nothing: it names a path under the working directory. The
          # measurement is the pin's, so when the claude-code version moves,
          # measure again. tests/run holds the check ("denies the model its
          # own environment").
          # Under the allow list above, /proc is outside the working directory
          # and refused as ungranted as well; the deny stays as the lock that
          # does not depend on the allow list's shape, so a later widening of
          # that list does not reopen it.
          claude -p "$(cat /tmp/brief.txt)

          Repair this failure by editing only the files the brief lists under
          implicated files. A change to any other file is refused before the
          gate runs, and so is a change the risk rules call red. If the fix
          needs a file outside that set, stop and explain instead of widening
          the change." \
            --allowedTools "Read(./**),Edit(./**)" \
            --disallowedTools "Read(.git/**),Edit(.git/**),Read(//proc/**)" \
            || echo "the attempt did not complete; the gate below still decides"

      # The gate decides, not the model, and not the absence of an error.
      - name: Verify and push
        id: push
        if: steps.budget.outputs.proceed == 'yes'
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          IMPLICATED: ${{ steps.scope.outputs.implicated }}
          # The token git pushes with. The checkout above did not keep it, so
          # it is here, for the push alone; GH_TOKEN is the same token, for
          # the label a refusal applies.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          before="$(git rev-parse HEAD)"
          # Every file in the checkout the attempt changed, and every file it
          # created, ignored ones included: a new file is in neither `git diff`
          # nor `git commit -a`, and the gate would still read it. Names are
          # taken unquoted, or a name outside ASCII never matches its entry in
          # the set. What this cannot see is anything outside the working
          # tree, which is why the Felix checkout is checked on its own below.
          changed="$({ git -c core.quotePath=false diff --name-only --no-renames HEAD
                       git -c core.quotePath=false ls-files --others; } | LC_ALL=C sort -u)"
          if [ -z "$changed" ]; then
            echo "nothing changed; leaving the failure as it was"; exit 0
          fi

          # Not pushed, the tree put back to the commit the attempt started
          # from, and handed to a person the way the scope step hands on a red
          # path. The job fails as well: a refused repair spent the budget and
          # repaired nothing.
          refuse() {
            git reset -q --hard "$before"
            git clean -fdxq
            echo "refused=yes" >> "$GITHUB_OUTPUT"
            pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" || pr=""
            if [ -z "$pr" ]; then
              echo "no open PR for $BRANCH; cannot escalate by label" >&2; exit 1
            fi
            gh pr edit "$pr" --add-label needs-founder || {
              echo "failed to apply needs-founder to #$pr" >&2; exit 1; }
            exit 1
          }

          # The files the brief named are the only ones a repair may change,
          # whatever tier the others are. A yellow file is enough to matter:
          # a test configuration, another test's skip marker, a dependency
          # pin, anything the gate reads can turn it green without the failure
          # being fixed, and the scope step judged the named files and no
          # others. Until 2026-09-24 this was a sentence in the prompt and
          # nothing checked it. What it does not stop is a change inside the
          # set, the failing test's own file included, which is the gate's
          # and a reviewer's to judge.
          if [ -z "${IMPLICATED:-}" ]; then
            echo "the scope step handed on no implicated set, so this attempt cannot be held to one; not pushing" >&2
            git reset -q --hard "$before"; git clean -fdxq
            exit 1
          fi
          # Written here, after the model ran, from the scope step's output.
          # grep's 1 is every change inside the set; 2 is a set it could not
          # read, which must not read as a set that allows everything.
          named="$(mktemp)"
          printf '%s\n' "$IMPLICATED" > "$named"
          gst=0
          outside="$(printf '%s\n' "$changed" | grep -vxF -f "$named")" || gst=$?
          if [ "$gst" -gt 1 ]; then
            echo "the implicated set could not be read (grep exit $gst); not pushing" >&2
            git reset -q --hard "$before"; git clean -fdxq
            exit 1
          fi
          if [ -n "$outside" ]; then
            printf '%s\n' "$outside" >&2
            echo "the attempt changed files the brief did not name; not pushing, and a person decides" >&2
            refuse
          fi
          # The Felix checkout beside this one is the judge: its CLI runs the
          # scope check and the gate below, and its risk table decides red.
          # The attempt step's rules keep the model out of it, and this checks
          # that they held. Nothing the job runs writes a tracked or unignored
          # file there, so anything that shows is the attempt's, and outside
          # the brief too. A change under either checkout's .git shows in no
          # check here; the attempt step's .git deny is what stops that.
          judge="$(git -C ../felix -c core.quotePath=false status --porcelain --untracked-files=all 2>&1)" \
            || judge="${judge:-unreadable}"
          if [ -n "$judge" ]; then
            printf '%s\n' "$judge" >&2
            echo "the Felix checkout that judges this repair changed during the attempt; not pushing, and a person decides" >&2
            refuse
          fi
          # GitHub refuses a push under .github/workflows from a token without
          # the workflows permission, which a GITHUB_TOKEN cannot be given.
          # Until 2026-09-23 such a repair ran the gate, passed it, and then
          # failed at the push.
          wf="$(git diff --name-only -- .github/workflows)"
          if [ -n "$wf" ]; then
            printf '%s\n' "$wf" >&2
            echo "the attempt edited a workflow file, which this job's token cannot push; not pushing, and a person decides" >&2
            git checkout -- .
            exit 1
          fi
          # GitHub's documented identity for a commit Actions makes. Until
          # 2026-09-22 this was a name of our own over the no-reply address of
          # the GitHub account named felix, a real person's (id 4426), so every
          # unattended commit in every repository that copied this file was
          # attributed to a stranger.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Committed before anything judges it, and pushed only at the end. A
          # content rule reads the lines a commit adds, so this is what lets a
          # credential or destructive SQL written into a named file count as red:
          # paths alone would pass both.
          git commit -qam "fix: unattended repair, verified by the gate

          Produced by the unattended loop. Pushed only because it changed no
          file the brief did not name, the risk rules did not call its own
          diff red, and the gate went green on it. Scope was checked before
          the failing log was read."
          # felix scope from a diff: 0 in scope, 3 red, anything else a diff
          # it could not classify. cmd_scope lists the same statuses.
          src=0
          ../felix/engine/harness/felix scope --base "$before" || src=$?
          case "$src" in
            0) ;;
            3) echo "the risk rules call the attempt's own diff red; not pushing, and a person decides" >&2
               refuse ;;
            *) echo "felix scope could not classify the attempt's diff (exit $src); a change nobody classified is not pushed" >&2
               git reset -q --hard "$before"
               exit 1 ;;
          esac
          if ! ../felix/engine/harness/felix gate; then
            echo "gate still red after the attempt; not pushing" >&2
            git reset -q --hard "$before"
            exit 1
          fi
          # A helper hands git the token from this step's environment at
          # push time: written to no file, passed in no argument. The empty
          # helper first clears any list the runner already had, so this
          # step's token is the one git offers and not whatever a helper
          # left behind answers with.
          git -c credential.helper= \
              -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GITHUB_TOKEN"; }; f' \
            push origin "HEAD:$BRANCH"
          echo "pushed=yes" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.scope.outputs.nothing }}" = "yes" ]; then
            echo "Nothing to repair: the gate is green, still running, ended without"
            echo "failing, or has not run on this branch. Nothing was invoked or spent."
          elif [ "${{ steps.scope.outputs.unnamed }}" = "yes" ]; then
            echo "The failing log names no file in this checkout, so an unattended"
            echo "repair would have nothing it may change. Nothing was invoked or spent."
          elif [ "${{ steps.scope.outputs.proceed }}" != "yes" ]; then
            echo "Stopped at scope. A person decides here."
          elif [ "${{ vars.FELIX_UNATTENDED }}" != "true" ]; then
            echo "In scope, and the switch is off. The guards ran and nothing was"
            echo "invoked or spent. This is the intended state until the risk rules"
            echo "have judged real changes."
          elif [ "${{ steps.budget.outputs.proceed }}" != "yes" ]; then
            echo "Budget exhausted for the last 24h. Nothing was invoked."
          elif [ "${{ steps.push.outputs.refused }}" = "yes" ]; then
            echo "Refused before the gate: the attempt changed a file the brief did"
            echo "not name, or the risk rules call its diff red. Nothing was pushed."
            echo "A person decides here."
          fi

  # The gate again, on the commit the repair pushed, since nothing this
  # workflow's token pushes starts a workflow (see the top of this file). A job
  # of its own so that actions: write, which a dispatch needs, is never held
  # by the job that runs the model. It dispatches the workflow whose failure
  # started this run, by id, or the gate by name when a person dispatched it.
  regate:
    needs: repair
    if: needs.repair.outputs.pushed == 'yes'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the gate on the pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ github.event.workflow_run.workflow_id || 'gate' }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -uo pipefail
          if ! out="$(gh workflow run "$GATE" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" 2>&1)"; then
            printf '%s\n' "$out" >&2
            echo "could not start the gate on $BRANCH, so the repair pushed there has no gate verdict. The gate workflow has to accept workflow_dispatch: add it to that workflow's on: block" >&2
            exit 1
          fi
          echo "the gate is running again on $BRANCH, whose tip the repair just pushed"

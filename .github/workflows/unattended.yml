name: unattended repair

# Wired, and off.
#
# Every guard below runs whether or not the switch is on, so the path is
# exercised rather than theoretical. Nothing invokes a model until the repository
# variable FELIX_UNATTENDED is set to "true", which is a deliberate act by a
# person who has watched the risk rules judge some real changes first.
#
# The rules deciding what is in scope were written in one sitting and have never
# been tested against a real failure. Turning this on before they have is
# trusting a boundary nobody has walked into.
#
#   gh variable set FELIX_UNATTENDED --body true --repo OWNER/REPO     enable
#   gh variable delete FELIX_UNATTENDED --repo OWNER/REPO              disable
#
# The division of labour matters more than any single guard. The model may read
# and edit, and nothing else. It cannot run git, cannot push, and cannot decide
# that its own work is finished. The workflow runs the gate afterwards and pushes
# only if the gate is green. An agent that verifies itself is not verified.

on:
  workflow_run:
    workflows: [gate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One at a time. A loop that can fan out is not bounded by an attempt ceiling,
# because each branch of the fan has its own.
concurrency:
  group: unattended-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    # workflow_run carries repository secrets even when the run it followed came
    # from a fork. The checkout below would fail for a fork branch anyway, but
    # relying on an accident is not a control, so same-repo is explicit.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # v5, the lowest major that runs on Node 24. v4 targets Node 20, which
      # the runner forces onto Node 24 with a warning until it stops doing so.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
          path: repo

      # Pinned, to the full sha of the Felix commit this file was copied from,
      # quoted so it is a string: YAML reads a sha of all digits as a number.
      # Felix publishes no tags. The scope step below branches on felix repair's
      # exit status, a contract between this file and the engine that
      # lib/repair.sh lists. Without a ref the engine is whatever Felix's default
      # branch holds when the job runs, and that contract changed four times on
      # 2026-09-23 (2 took in a ceiling that could not be counted, 4 split off
      # from 2, nothing to repair moved from 0 to 5, then 0 narrowed to failed
      # or timed-out runs with a log) under copies that had not changed.
      # Pinned, the engine and this file move together, in one change reviewed
      # here: copy the template again from the commit the new pin names. The
      # claude-code install below is pinned for the same reason: this job holds
      # a write token, and an API key once it is switched on, and an unpinned
      # checkout runs whatever merged in Felix that day.
      #
      # What the pin costs: the risk table and gate script Felix holds for this
      # repository are read from the same commit. A path made red in Felix after
      # the pin is not red to this loop until the pin moves, so move it when
      # either changes.
      - uses: actions/checkout@v5
        with:
          repository: LeavesJ/felix-home
          ref: '685d37beedc4590a989ccd145db3069af8e7f76a'
          ssh-key: ${{ secrets.FELIX_DEPLOY_KEY }}
          path: felix

      # Scope before anything reads the failing log. Handing a model the
      # diagnostics and then telling it what it may not touch is the wrong order.
      - name: Scope the failure
        id: scope
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # Actions runs a step that names no shell as `bash -e`, and under
          # pipefail that ended this step at felix repair's first non-zero
          # status, before rc was read: a ceiling or a red path failed the job
          # and escalated nothing, and nothing to repair would have failed it
          # too. Every exit below is explicit instead.
          set +e -uo pipefail
          ../felix/engine/harness/felix repair | tee /tmp/brief.txt
          rc=${PIPESTATUS[0]}
          # Only 0 is a brief to act on: a gate run that failed or timed out,
          # with a log to read. 5 is nothing to repair: the gate has not run on
          # the branch, is still running, is green, or ended without failing.
          # 4 is a checkout the Felix checked out above does not govern, 3 a
          # red path, 2 a repair ceiling that is reached or could not be
          # counted, and anything else a gate run nobody could read: its runs
          # or its log unreadable, or a run that never started and left none.
          # lib/repair.sh lists the same statuses. Until 2026-09-23 nothing to repair exited
          # 0, so a dispatch on a green branch would have spent the budget and
          # handed a model a brief saying nothing was wrong. This also
          # proceeded on everything but 3, which under plain bash let a
          # reached ceiling do the same; under `bash -e` the step ended first.
          if [ "$rc" = "0" ]; then echo "proceed=yes" >> "$GITHUB_OUTPUT"; exit 0; fi

          echo "proceed=no" >> "$GITHUB_OUTPUT"
          case "$rc" in
            # Not a stop for a person: nothing failed, so nothing is escalated
            # and the job passes.
            5) echo "nothing=yes" >> "$GITHUB_OUTPUT"
               echo "nothing to repair on $BRANCH"; exit 0 ;;
            3) echo "out of scope: a red path is implicated" >&2 ;;
            2) echo "the repair ceiling is reached, or could not be counted" >&2 ;;
            # Wiring, not the change: it holds for every branch at once, so no
            # pull request is labelled for it and the job fails instead.
            4) echo "no project in the Felix this workflow checked out governs this repository, or its .felix names one that does not exist; fix the binding, since no pull request can" >&2
               exit 1 ;;
            *) echo "felix repair could not read the gate's runs or the failing run's log (exit $rc); nothing is repaired from a run nobody read" >&2
               exit 1 ;;
          esac
          # Escalation is the one path that must not fail quietly. If the label
          # cannot be applied, the job fails so somebody notices, rather than a
          # red-path failure disappearing into a green checkmark.
          pr="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$pr" ]; then
            echo "no open PR for $BRANCH; cannot escalate by label" >&2; exit 1
          fi
          gh pr edit "$pr" --add-label needs-founder || {
            echo "failed to apply needs-founder to #$pr" >&2; exit 1; }

      # Budget is spent only by a run that will actually do something. Charging
      # for a run that stops at the switch would exhaust the ceiling while the
      # loop was still disabled, and leave nothing for the day it is enabled.
      - name: Spend from the budget
        id: budget
        if: steps.scope.outputs.proceed == 'yes' && vars.FELIX_UNATTENDED == 'true'
        working-directory: repo
        run: |
          if ../felix/engine/harness/felix budget --record --why "ci repair"; then
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt a repair
        if: steps.budget.outputs.proceed == 'yes'
        working-directory: repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          # Pinned. An unpinned global install pulls whatever shipped that
          # morning into a job holding an API key.
          #
          # npm's output is shown only when the install fails. It was thrown
          # away, and Actions runs this step as `bash -e`, so a failed install
          # ended the step at that line with nothing printed, after the budget
          # step had already recorded the run's spend.
          if ! npm_log="$(npm install -g @anthropic-ai/claude-code@2.1.37 2>&1)"; then
            printf '%s\n' "$npm_log" | tail -20 >&2
            echo "could not install @anthropic-ai/claude-code@2.1.37, so no repair was attempted; this run's spend is already recorded against the daily budget" >&2
            exit 1
          fi
          # Read and Edit only. No git, no shell, no push. The model changes
          # files; this workflow decides whether the change is acceptable.
          claude -p "$(cat /tmp/brief.txt)

          Repair this failure by editing files. Do not touch any path the brief
          did not name. If the fix needs a file outside that set, stop and
          explain instead of widening the change." \
            --allowedTools "Read,Edit" \
            || echo "the attempt did not complete; the gate below still decides"

      # The gate decides, not the model, and not the absence of an error.
      - name: Verify and push
        if: steps.budget.outputs.proceed == 'yes'
        working-directory: repo
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -uo pipefail
          if git diff --quiet; then
            echo "nothing changed; leaving the failure as it was"; exit 0
          fi
          if ! ../felix/engine/harness/felix gate; then
            echo "gate still red after the attempt; not pushing" >&2
            git checkout -- .
            exit 1
          fi
          # GitHub's documented identity for a commit Actions makes. Until
          # 2026-09-22 this was a name of our own over the no-reply address of
          # the GitHub account named felix, a real person's (id 4426), so every
          # unattended commit in every repository that copied this file was
          # attributed to a stranger.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix: unattended repair, verified by the gate

          Produced by the unattended loop and pushed only because the gate went
          green afterwards. Scope was checked before the failing log was read."
          git push origin "HEAD:$BRANCH"

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.scope.outputs.nothing }}" = "yes" ]; then
            echo "Nothing to repair: the gate is green, still running, ended without"
            echo "failing, or has not run on this branch. Nothing was invoked or spent."
          elif [ "${{ steps.scope.outputs.proceed }}" != "yes" ]; then
            echo "Stopped at scope. A person decides here."
          elif [ "${{ vars.FELIX_UNATTENDED }}" != "true" ]; then
            echo "In scope, and the switch is off. The guards ran and nothing was"
            echo "invoked or spent. This is the intended state until the risk rules"
            echo "have judged real changes."
          elif [ "${{ steps.budget.outputs.proceed }}" != "yes" ]; then
            echo "Budget exhausted for the last 24h. Nothing was invoked."
          fi

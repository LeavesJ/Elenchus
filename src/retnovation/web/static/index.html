<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retnovation</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0a0f1c;color:#e8eef7;font:16px/1.55 ui-sans-serif,system-ui,sans-serif}
  #wrap{max-width:760px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  #thread{flex:1;overflow-y:auto;padding:24px 18px 8px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:80%;padding:11px 15px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .vera{align-self:flex-start;background:#0f1a2b;border:1px solid #1b2b44;color:#dfe9f6}
  .you{align-self:flex-end;background:#155e63;color:#eafffb}
  .muted{align-self:center;color:#8aa0bf;font-size:13px;text-align:center;max-width:90%}
  .thinking{align-self:flex-start;color:#5eead4;font-size:14px;padding:6px 4px}
  .thinking span{animation:tdot 1.2s infinite}
  .thinking span:nth-child(2){animation-delay:.2s} .thinking span:nth-child(3){animation-delay:.4s}
  @keyframes tdot{0%,60%,100%{opacity:.2}30%{opacity:1}}
  .menu{align-self:stretch;display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .menu button{text-align:left;background:#0f1a2b;border:1px solid #1b2b44;color:#e8eef7;border-radius:10px;
    padding:12px 14px;font:inherit;cursor:pointer}
  .menu button:hover{background:#13203450;border-color:#2b4a6b}
  #composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid #14233b;background:#0a0f1c}
  #composer textarea{flex:1;background:#0f1a2b;color:#e8eef7;border:1px solid #1b2b44;border-radius:12px;
    padding:11px 13px;font:inherit;min-height:46px;max-height:160px;resize:none}
  #composer button{background:#155e63;color:#eafffb;border:0;border-radius:11px;padding:0 18px;font:inherit;cursor:pointer}
  #composer button:disabled{opacity:.5;cursor:default}
  #composer[hidden]{display:none}
  .terrain{align-self:center;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0 2px}
  .node{width:18px;height:18px;border-radius:50%;background:#0f3a3f;box-shadow:0 0 6px #155e63}
  .node.v2{background:#1d6f6f;box-shadow:0 0 12px #2bd4c4}
  .node.v3{background:#2bd4c4;box-shadow:0 0 18px #5eead4}
  .end{align-self:center;margin-top:8px;background:#0f1a2b;border:1px solid #2b4a6b;color:#cfe;
    border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer}
  .end:disabled{opacity:.5;cursor:default}
  #wrap{--accent:#5a6a85}
  .accent-amber{--accent:#ba7517} .accent-teal{--accent:#1d9e75} .accent-slate{--accent:#5a6a85}
  .you{background:var(--accent)!important}
  #mark{position:fixed;top:12px;left:14px;width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:#06101e;display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:14px;opacity:.9}
</style>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/CopyShader.js"></script>
<script src="/static/vendor/LuminosityHighPassShader.js"></script>
<script src="/static/vendor/EffectComposer.js"></script>
<script src="/static/vendor/RenderPass.js"></script>
<script src="/static/vendor/ShaderPass.js"></script>
<script src="/static/vendor/UnrealBloomPass.js"></script>
<script src="/static/terrain3d.js"></script>
</head>
<body><div id="wrap">
  <div id="mark" hidden></div>
  <div id="thread"></div>
  <form id="composer" hidden>
    <textarea id="input" placeholder="Take a position. Reason it out." rows="1"></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
const thread = document.getElementById('thread');
const composer = document.getElementById('composer');
const input = document.getElementById('input');
const send = document.getElementById('send');
let mode='engine';  // 'engine' -> /say (gate + probes); 'converse' -> /converse (post-convergence)
const post = (url, body) => fetch(url, {method:'POST', headers:{'content-type':'application/json'},
  body: body?JSON.stringify(body):null}).then(r=>r.json());
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function bubble(cls, text){ const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=esc(text);
  thread.appendChild(d); thread.scrollTop=thread.scrollHeight; return d; }
function muted(text){ const d=document.createElement('div'); d.className='muted'; d.innerHTML=esc(text);
  thread.appendChild(d); thread.scrollTop=thread.scrollHeight; }
function thinking(){ const d=document.createElement('div'); d.className='thinking';
  d.innerHTML='Vera is thinking<span>.</span><span>.</span><span>.</span>'; thread.appendChild(d);
  thread.scrollTop=thread.scrollHeight; return d; }
function showComposer(on){ composer.hidden=!on; if(on){ input.disabled=false; send.disabled=false; input.focus(); } }
function applyTheme(t){ if(!t) return;
  const w=document.getElementById('wrap'); w.className='';
  if(t.accent) w.classList.add('accent-'+t.accent);
  const mk=document.getElementById('mark');
  if(t.persona_mark){ mk.textContent=t.persona_mark; mk.hidden=false;
    if(t.atmosphere_label) mk.title=t.atmosphere_label; } }

async function start(){
  const r = await post('/api/session');
  applyTheme(r.theme);
  renderMenu(r.problems);
}
function renderMenu(problems){
  muted('Pick a problem to work. You are never told the move to make.');
  const m=document.createElement('div'); m.className='menu';
  problems.forEach((p,i)=>{ const b=document.createElement('button'); b.innerHTML=esc(p);
    b.onclick=()=>choose(i,m); m.appendChild(b); });
  thread.appendChild(m); thread.scrollTop=thread.scrollHeight;
}
async function choose(i, menuEl){
  menuEl.remove();
  const t=thinking(); const r=await post('/api/session/single/choose',{index:i}); t.remove();
  advance(r);
}
function advance(r){
  if(r.kind==='say'){ applyTheme(r.theme); bubble('vera', r.text); showComposer(true); return; }
  if(r.kind==='done'){ mode='converse'; if(r.landing) bubble('vera', r.landing); showComposer(true); endButton(); return; }
  if(r.kind==='close'){ renderClose(r); return; }
  if(r.kind==='nudge'){ muted(r.message); showComposer(true); return; }
  muted('error: '+(r.message||'')); showComposer(true);
}
function endButton(){
  const b=document.createElement('button'); b.className='end'; b.type='button'; b.textContent='End session';
  b.onclick=async()=>{ b.disabled=true; const t=thinking();
    try{ const r=await post('/api/session/single/close'); t.remove(); renderClose(r); }
    catch(_){ t.remove(); b.disabled=false; muted('connection lost — try again.'); } };
  thread.appendChild(b); thread.scrollTop=thread.scrollHeight;
}
function renderClose(r){ if(r.close) bubble('vera', r.close); renderTerrain(r.terrain||[]); showComposer(false); }
function renderTerrain(regions){
  regions = regions || [];
  const rendered = regions.filter(x=>x.render==='rendered').length;
  const host=document.createElement('div'); host.className='terrain3d';
  // flex:none is LOAD-BEARING: #thread is a fixed-height column flex; overflow:hidden zeroes this
  // box's automatic min size, so without it the host absorbs ALL flex-shrink and collapses to 0px
  // the moment the dialogue overflows the thread — i.e. in every real session (dogfood 2026-07-01).
  host.style.cssText='align-self:stretch;flex:none;width:100%;height:460px;border-radius:16px;'
    +'overflow:hidden;margin:10px 0 2px;background:#04060c;position:relative';
  thread.appendChild(host);
  muted(rendered ? (rendered+' area'+(rendered===1?'':'s')+(rendered===1?' has':' have')+' taken shape.')
                 : 'A seed was planted — your world begins.');
  try { if(window.Terrain3D) Terrain3D.render(host, regions); } catch(_) { /* text note stands as fallback */ }
  thread.scrollTop=thread.scrollHeight;
}
composer.addEventListener('submit', async e=>{
  e.preventDefault();
  const text=input.value.trim(); if(!text) return;
  bubble('you', text); input.value=''; input.disabled=true; send.disabled=true;
  const t=thinking();
  const url = mode==='converse' ? '/api/session/single/converse' : '/api/session/single/say';
  try { const r=await post(url,{text}); t.remove(); advance(r); }
  catch(err){ t.remove(); muted('connection lost — is the server still running? try again.'); showComposer(true); }
});
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); composer.requestSubmit(); } });
start();
</script></body></html>

# The F1 regression baseline (user-steered chapters spec §4). Each turn is a post-landing student
# message in the wind-down. `non_steers` must distill next_pressure == "" (re-litigations of the
# landed call — including REWORDED ones that map to an adjacent type, the F4 laundering case — plus
# comments, questions, thanks). `genuine` must distill a NON-EMPTY steer (a new decision-frame she
# now faces). The key-gated test_live_steer_f1 asserts the false-non-empty rate over `non_steers`
# stays at/under max_false_nonempty_rate. Re-run it (under threshold) on ANY change to
# concierge_converse.md or the model id (documented gate, spec §4). Structure runs offline (L-22).
# Generic startup scenarios only — no confidential material (L-2/L-26).
#
# RECORDED BASELINE (first founder-run @live, 2026-07-05, claude-opus-4-8): false_nonempty_rate =
# 0.000 (7/7 non_steers correctly empty, incl. the "that's the crux, right?" reflection and the
# "can you say more about why..." advice-ask) and 3/3 genuine frames distilled a clean frame-blind
# steer. The 0.15 threshold is KEPT as a deliberate 1-slip stochasticity margin (floor(7*0.15)=1) —
# a judge-noise slip on one borderline non_steer must not red the gate (L-15). Re-run and re-record
# on ANY concierge_converse.md or model-id change (spec §4).
max_false_nonempty_rate: 0.15
context:
  problem: >
    You run a 14-person seed-stage company. Your one enterprise pilot wants a feature your roadmap
    doesn't have, and building it eats the quarter you set aside for the self-serve launch. The
    pilot could become a third of next year's revenue — or churn in six months. Decide.
  landed_position: >
    I'm going to hold the roadmap and tell the pilot no on the custom feature — the self-serve
    launch is the bet the company is actually built on.
non_steers:
  - "Right, so really the whole thing came down to protecting the core bet, not chasing the logo."
  - "Wait — didn't you push me the other way three turns ago?"
  - "So to be clear, saying no here was about focus, not about the money."
  - "Honestly that clarified a lot. Thanks."
  - "I still think holding the roadmap is right, just wanted to say it out loud once more."
  - "So the real reason I'm saying no is that the launch is the whole company — that's the crux, right?"
  - "Can you say more about why chasing the logo would have been the wrong instinct here?"
genuine:
  - "Okay, separate thing — now I have to decide whether to raise a bridge round before the launch or run lean into it."
  - "Different call: my technical co-founder wants to hand pilot support to a junior eng and I'm not sure I trust that."
  - "New problem — a bigger competitor just offered to acquire us and I have two weeks to answer."

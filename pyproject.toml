[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elenchus"
version = "0.1.0"
description = "A retention-and-deployment engine: a thin doctrine layer over a rented model."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
web = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
elenchus = "elenchus.cli:main"
elenchus-ingest = "elenchus.veldra_ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned to what ruff selected by default through 0.15. 0.16 widened the defaults, and rebuilding
# the venv (`ruff>=0.6`) turned a green gate red across ~40 pre-existing sites that no one had
# chosen to change — implicit string concatenation, blind excepts that are deliberate, the
# datetime.UTC alias. A gate whose meaning depends on which ruff you happened to install is not a
# gate, so the rule set is explicit here. Widening it is a deliberate act, taken on purpose, with
# the resulting diff reviewed.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: exercises the real Anthropic API (requires ANTHROPIC_API_KEY); skipped otherwise",
]

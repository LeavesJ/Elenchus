[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retnovation"
version = "0.1.0"
description = "A retention-and-deployment engine: a thin doctrine layer over a rented model."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
retnovation = "retnovation.cli:main"

[tool.setuptools]
packages = ["retnovation"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elenchus"
version = "0.1.0"
description = "A retention-and-deployment engine: a thin doctrine layer over a rented model."
requires-python = ">=3.12"
# A floor is a compatibility claim, and these are checked by installing them, not by reading them.
# `pydantic>=2.0` and `pyyaml>=6.0` were both false against this project's own `requires-python`:
# on 3.14, pyyaml 6.0 fails to build outright, and pydantic below 2.12 has no pydantic-core wheel
# and needs a Rust toolchain. 2.0.0 is additionally excluded by fastapi's own metadata, so the
# declared floor set was not merely optimistic, it was unsatisfiable. The suite passes at exactly
# these versions.
# Upper bounds on purpose. Every specifier here was lower-bound-only, and CI installs with
# `pip install -e ".[dev,web]"` on a fresh resolve, so CI silently took the newest release of
# everything on every run while the local venv and the served process stayed where they were
# last built. `anthropic>=0.120` admits 1.2.0 -- a MAJOR of the SDK this product rents its whole
# capability from -- and CI withholds ANTHROPIC_API_KEY, so the 11 @live tests skip there and
# every SDK assertion that does run is made against a hand-rolled fake. A green built on a stack
# nobody chose is Invariant 7's failure in the build system: the property is gate TIMES
# distribution, and CI's distribution was not production's.
#
# This is the same call already taken for the linter below ("A gate whose meaning depends on
# which ruff you happened to install is not a gate"), applied to the runtime. Raising any of
# these is a deliberate act, taken on purpose, with the @live suite run against a real key.
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3,<7",
    "anthropic>=0.120,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# httpx<1 keeps starlette's TestClient on the client it currently supports: anthropic 1.x
# requires httpx2, so that migration rides the SDK major and is not a separate chore.
# starlette pinned explicitly: fastapi<1 still pulls starlette>=0.46 with NO upper bound, and
# starlette is the one dependency here that actually shipped a major and changed behaviour the
# suite depends on (pre-merge review, 2026-09-02).
web = ["fastapi>=0.110,<1", "starlette>=0.46,<2", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]

[project.scripts]
elenchus = "elenchus.cli:main"
elenchus-ingest = "elenchus.veldra_ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned to what ruff selected by default through 0.15. 0.16 widened the defaults, and rebuilding
# the venv (`ruff>=0.6`) turned a green gate red across ~40 pre-existing sites that no one had
# chosen to change — implicit string concatenation, blind excepts that are deliberate, the
# datetime.UTC alias. A gate whose meaning depends on which ruff you happened to install is not a
# gate, so the rule set is explicit here. Widening it is a deliberate act, taken on purpose, with
# the resulting diff reviewed.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_default_env_file: sees the shipped DEFAULT_ENV_FILE rather than the hermetic stub",
    "live: exercises the real Anthropic API (requires ANTHROPIC_API_KEY); skipped otherwise",
]
